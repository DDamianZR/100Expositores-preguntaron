<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100 Metodólogos Dijeron — ESCOM Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bungee&family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #0a0022;
    --bg-2: #1a0040;
    --bg-3: #050014;
    --gold: #FFD700;
    --gold-2: #FFA500;
    --cyan: #00E5FF;
    --cyan-2: #00B8D4;
    --magenta: #FF006E;
    --magenta-2: #C2185B;
    --green: #00FF88;
    --red: #FF1744;
    --white: #FFFFFF;
    --paper: #FFF8DC;
    --shadow-neon-gold: 0 0 20px rgba(255,215,0,.8), 0 0 40px rgba(255,215,0,.5), 0 0 60px rgba(255,165,0,.3);
    --shadow-neon-cyan: 0 0 20px rgba(0,229,255,.8), 0 0 40px rgba(0,229,255,.5);
    --shadow-neon-magenta: 0 0 20px rgba(255,0,110,.8), 0 0 40px rgba(255,0,110,.5);
    --font-display: 'Bebas Neue', 'Impact', 'Arial Black', sans-serif;
    --font-chunky: 'Bungee', 'Impact', sans-serif;
    --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    min-height: 100vh;
    overflow-x: hidden;
    font-family: var(--font-body);
    color: var(--white);
    background: var(--bg-3);
    user-select: none;
  }

  /* Fondo animado con degradado y estrellas */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(255,0,110,.25), transparent 55%),
      radial-gradient(ellipse at 80% 15%, rgba(0,229,255,.22), transparent 55%),
      radial-gradient(ellipse at 50% 90%, rgba(255,215,0,.20), transparent 60%),
      linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 50%, var(--bg-3) 100%);
    z-index: -3;
    animation: bgShift 22s ease-in-out infinite alternate;
  }
  @keyframes bgShift {
    0%   { filter: hue-rotate(0deg) brightness(1); }
    100% { filter: hue-rotate(35deg) brightness(1.12); }
  }

  /* Estrellas parpadeando */
  #stars {
    position: fixed;
    inset: 0;
    z-index: -2;
    pointer-events: none;
    overflow: hidden;
  }
  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    opacity: .9;
    animation: twinkle var(--dur, 3s) ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: .2; transform: scale(.8); }
    50%      { opacity: 1;  transform: scale(1.3); }
  }

  /* Emojis flotantes de ciencia */
  #floaters { position: fixed; inset: 0; z-index: -2; pointer-events: none; overflow: hidden; }
  .floater {
    position: absolute;
    font-size: 1.4rem;
    opacity: .12;
    animation: floatUp linear infinite;
    filter: blur(.4px);
  }
  @keyframes floatUp {
    0%   { transform: translateY(110vh) rotate(0deg); }
    100% { transform: translateY(-15vh)  rotate(360deg); }
  }

  /* Screen shake global (para strikes) */
  body.shake { animation: shakeIt .4s cubic-bezier(.36,.07,.19,.97); }
  @keyframes shakeIt {
    10%, 90%  { transform: translate3d(-2px, 0, 0); }
    20%, 80%  { transform: translate3d(4px, 0, 0); }
    30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
    40%, 60%  { transform: translate3d(6px, 0, 0); }
  }

  /* Rejilla retro estilo synthwave */
  #grid {
    position: fixed;
    inset: auto 0 0 0;
    height: 40vh;
    z-index: -1;
    pointer-events: none;
    background:
      linear-gradient(to top, rgba(10,0,34,.9), transparent 80%),
      repeating-linear-gradient(90deg, transparent 0, transparent 60px, rgba(255,215,0,.14) 60px, rgba(255,215,0,.14) 61px),
      repeating-linear-gradient(0deg,  transparent 0, transparent 40px, rgba(0,229,255,.12) 40px, rgba(0,229,255,.12) 41px);
    transform: perspective(400px) rotateX(60deg);
    transform-origin: bottom;
  }

  #app {
    position: relative;
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 18px 12px 40px;
  }

  /* ================= HEADER ================= */
  header.top {
    width: 100%;
    max-width: 1400px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 18px;
    align-items: stretch;
    margin-bottom: 14px;
  }

  .scoreboard {
    position: relative;
    background: linear-gradient(135deg, rgba(0,0,0,.55), rgba(0,0,0,.25));
    border-radius: 20px;
    padding: 14px 22px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    overflow: hidden;
    transition: transform .3s cubic-bezier(.34,1.56,.64,1);
  }
  .scoreboard::before {
    content: "";
    position: absolute; inset: 0;
    border-radius: 20px;
    padding: 3px;
    background: linear-gradient(135deg, var(--team-color, var(--cyan)), rgba(255,255,255,.2), var(--team-color, var(--cyan)));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    pointer-events: none;
  }
  .scoreboard.team-1 { --team-color: var(--cyan); }
  .scoreboard.team-2 { --team-color: var(--magenta); }
  .scoreboard.active {
    transform: translateY(-4px) scale(1.03);
    box-shadow: 0 0 40px var(--team-color), 0 0 80px var(--team-color), inset 0 0 30px rgba(255,255,255,.1);
    animation: pulseGlow 1.4s ease-in-out infinite;
  }
  @keyframes pulseGlow {
    0%,100% { filter: brightness(1); }
    50%     { filter: brightness(1.25); }
  }
  .team-row { display: flex; align-items: center; gap: 12px; }
  .team-emoji {
    font-size: 2.2rem;
    filter: drop-shadow(0 0 12px var(--team-color));
    animation: floaty 3s ease-in-out infinite;
  }
  @keyframes floaty {
    0%,100% { transform: translateY(0) rotate(-3deg); }
    50%     { transform: translateY(-6px) rotate(3deg); }
  }
  .team-name {
    font-family: var(--font-display);
    font-size: clamp(1.1rem, 2.4vw, 1.8rem);
    letter-spacing: .04em;
    color: var(--white);
    text-shadow: 0 0 12px var(--team-color);
    line-height: 1;
  }
  .team-score {
    font-family: var(--font-chunky);
    font-size: clamp(2.4rem, 5.5vw, 4rem);
    color: var(--gold);
    text-shadow: var(--shadow-neon-gold);
    line-height: 1;
    letter-spacing: .02em;
    display: inline-block;
    transition: transform .25s;
  }
  .team-score.bump { animation: bump .5s cubic-bezier(.34,1.56,.64,1); }
  @keyframes bump {
    0% { transform: scale(1); }
    45% { transform: scale(1.45) rotate(-6deg); color: var(--green); }
    100% { transform: scale(1); }
  }
  .team-score-row { display: flex; align-items: baseline; gap: 8px; margin-top: 6px; }
  .team-round-pts { font-size: .8rem; opacity: .8; color: var(--paper); }
  .active-badge {
    position: absolute; top: -10px; right: 14px;
    background: linear-gradient(135deg, var(--gold), var(--gold-2));
    color: #000; padding: 3px 12px; border-radius: 999px;
    font-family: var(--font-chunky); font-size: .75rem;
    box-shadow: 0 0 12px var(--gold);
    transform: rotate(3deg);
    animation: wobble 1.6s ease-in-out infinite;
  }
  @keyframes wobble { 0%,100% { transform: rotate(3deg);} 50% { transform: rotate(-3deg);} }

  /* Logo central */
  .logo-wrap {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
    padding: 0 6px;
  }
  .logo-main {
    font-family: var(--font-chunky);
    font-size: clamp(1.8rem, 4vw, 3.2rem);
    background: linear-gradient(135deg, var(--gold) 0%, #fff9c4 40%, var(--gold-2) 60%, var(--gold) 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: .03em;
    line-height: .95;
    text-shadow: var(--shadow-neon-gold);
    filter: drop-shadow(0 0 12px rgba(255,215,0,.7));
    animation: neonPulse 2.4s ease-in-out infinite;
  }
  @keyframes neonPulse {
    0%,100% { filter: drop-shadow(0 0 8px rgba(255,215,0,.6)); }
    50%     { filter: drop-shadow(0 0 20px rgba(255,215,0,1)); }
  }
  .logo-sub {
    font-family: var(--font-display);
    letter-spacing: .3em;
    font-size: .8rem;
    color: var(--cyan);
    text-shadow: 0 0 10px var(--cyan);
    margin-top: 4px;
  }
  .round-chip {
    margin-top: 8px;
    background: rgba(0,0,0,.45);
    border: 2px solid var(--gold);
    color: var(--gold);
    font-family: var(--font-chunky);
    font-size: .95rem;
    padding: 4px 14px;
    border-radius: 999px;
    box-shadow: inset 0 0 12px rgba(255,215,0,.3), 0 0 12px rgba(255,215,0,.4);
  }
  .double-chip {
    margin-top: 6px;
    background: linear-gradient(135deg, var(--magenta), var(--gold));
    border: 2px solid #fff;
    color: #fff;
    font-family: var(--font-chunky);
    font-size: .85rem;
    padding: 3px 14px;
    border-radius: 999px;
    box-shadow: 0 0 18px var(--magenta);
    animation: wobble 1.4s ease-in-out infinite;
    text-shadow: 0 1px 3px rgba(0,0,0,.5);
  }
  .pool-chip {
    margin-top: 6px;
    background: rgba(0,255,136,.15);
    border: 2px solid var(--green);
    color: var(--green);
    font-family: var(--font-chunky);
    font-size: .85rem;
    padding: 3px 14px;
    border-radius: 999px;
    box-shadow: 0 0 14px rgba(0,255,136,.5);
    text-shadow: 0 0 6px var(--green);
  }

  /* Top-right utility buttons */
  .top-utils {
    position: fixed; top: 12px; right: 12px;
    display: flex; gap: 8px;
    z-index: 50;
  }
  .util-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(0,0,0,.55);
    border: 2px solid rgba(255,215,0,.5);
    color: var(--gold);
    font-size: 1.1rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s, box-shadow .15s, background .2s;
    backdrop-filter: blur(6px);
  }
  .util-btn:hover { transform: scale(1.1); box-shadow: 0 0 16px var(--gold); }

  /* Modal (reglas) */
  .modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.85);
    display: flex; align-items: center; justify-content: center;
    z-index: 200;
    padding: 20px;
    animation: fadeIn .2s;
  }
  .modal-card {
    background: linear-gradient(160deg, #12053a, #1a0055);
    border: 3px solid var(--gold);
    border-radius: 20px;
    padding: 26px 30px;
    max-width: 640px;
    width: 100%;
    box-shadow: var(--shadow-neon-gold);
    max-height: 88vh;
    overflow-y: auto;
  }
  .modal-title {
    font-family: var(--font-chunky);
    font-size: 1.6rem;
    color: var(--gold);
    text-shadow: 0 0 12px var(--gold);
    margin-bottom: 12px;
    text-align: center;
  }
  .modal-body { font-family: var(--font-body); line-height: 1.55; color: var(--paper); font-size: .96rem; }
  .modal-body b { color: var(--gold); }
  .modal-body ul { padding-left: 22px; margin-top: 8px; }
  .modal-body li { margin: 4px 0; }
  .modal-close-row { display: flex; justify-content: center; margin-top: 18px; }

  /* Round transition splash */
  .round-splash {
    position: fixed; inset: 0;
    background: radial-gradient(circle at center, rgba(10,0,34,.98), rgba(0,0,0,.9));
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 300;
    animation: splashFade .3s;
  }
  .splash-num {
    font-family: var(--font-chunky);
    font-size: clamp(4rem, 15vw, 12rem);
    background: linear-gradient(135deg, var(--gold), #fff, var(--gold-2));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 30px var(--gold));
    animation: splashZoom .8s cubic-bezier(.34,1.56,.64,1);
    line-height: .9;
  }
  .splash-label {
    font-family: var(--font-display);
    letter-spacing: .3em;
    font-size: 1.4rem;
    color: var(--cyan);
    text-shadow: 0 0 12px var(--cyan);
    margin-bottom: 10px;
  }
  .splash-topic {
    margin-top: 20px;
    font-family: var(--font-chunky);
    color: var(--white);
    font-size: clamp(1.1rem, 3vw, 2rem);
    max-width: 80vw;
    text-align: center;
    text-shadow: 0 0 12px rgba(255,215,0,.6);
    animation: splashSlide .8s .2s both;
  }
  @keyframes splashFade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes splashZoom {
    0%   { transform: scale(.2) rotate(-15deg); opacity: 0; }
    60%  { transform: scale(1.2) rotate(6deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  @keyframes splashSlide {
    from { transform: translateY(30px); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
  }

  /* Round win banner */
  .round-win-banner {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: linear-gradient(135deg, var(--gold), var(--gold-2));
    color: #000;
    font-family: var(--font-chunky);
    font-size: clamp(1.8rem, 5vw, 3.4rem);
    padding: 22px 44px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 0 60px var(--gold), 0 0 120px rgba(255,215,0,.4);
    z-index: 150;
    animation: winBanner 2.6s ease-out forwards;
    letter-spacing: .04em;
    border: 4px solid #fff;
  }
  @keyframes winBanner {
    0%   { transform: translate(-50%, -50%) scale(0) rotate(-20deg); opacity: 0; }
    20%  { transform: translate(-50%, -50%) scale(1.15) rotate(4deg); opacity: 1; }
    40%  { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
    85%  { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1.1) rotate(0deg); opacity: 0; }
  }

  /* ================= MAIN AREA ================= */
  main {
    width: 100%;
    max-width: 1400px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .question-card {
    width: 100%;
    max-width: 1200px;
    background:
      radial-gradient(ellipse at top, rgba(255,215,0,.15), transparent 60%),
      linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.4));
    border: 3px solid var(--gold);
    border-radius: 20px;
    padding: 20px 30px;
    text-align: center;
    box-shadow: var(--shadow-neon-gold), inset 0 0 30px rgba(255,215,0,.1);
    position: relative;
    animation: questionIn .6s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes questionIn {
    from { opacity: 0; transform: translateY(-20px) scale(.9); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .question-card::before, .question-card::after {
    content: "★";
    position: absolute; top: 50%;
    color: var(--gold);
    font-size: 1.8rem;
    transform: translateY(-50%);
    text-shadow: 0 0 12px var(--gold);
    animation: sparkle 2s ease-in-out infinite;
  }
  .question-card::before { left: 14px; }
  .question-card::after  { right: 14px; animation-delay: 1s; }
  @keyframes sparkle {
    0%,100% { transform: translateY(-50%) rotate(0deg) scale(1); opacity: .8; }
    50%     { transform: translateY(-50%) rotate(180deg) scale(1.3); opacity: 1; }
  }
  .question-label {
    font-family: var(--font-display);
    letter-spacing: .28em;
    font-size: .75rem;
    color: var(--cyan);
    text-shadow: 0 0 8px var(--cyan);
  }
  .question-text {
    font-family: var(--font-chunky);
    font-size: clamp(1.15rem, 2.4vw, 1.85rem);
    color: var(--white);
    margin-top: 6px;
    line-height: 1.25;
    text-shadow: 0 2px 12px rgba(0,0,0,.6);
  }

  /* Panel de respuestas */
  .board {
    width: 100%;
    max-width: 1200px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    perspective: 1200px;
  }
  .board.single-col { grid-template-columns: 1fr; max-width: 900px; }

  .answer {
    position: relative;
    height: 82px;
    border-radius: 14px;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform .8s cubic-bezier(.65,-0.15,.35,1.15), box-shadow .3s;
  }
  .answer:hover:not(.revealed) .face-front { box-shadow: 0 0 24px var(--cyan), inset 0 0 20px rgba(0,229,255,.3); }
  .answer.revealed { transform: rotateY(180deg); }
  .answer .face {
    position: absolute; inset: 0;
    border-radius: 14px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    display: flex; align-items: center;
    padding: 0 18px;
    overflow: hidden;
  }
  .face-front {
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,.05) 0 8px, transparent 8px 16px),
      linear-gradient(135deg, #1a1550, #0a0033);
    border: 2px solid rgba(0,229,255,.35);
    box-shadow: inset 0 0 20px rgba(0,229,255,.15);
    transition: box-shadow .3s;
  }
  .face-back {
    background: linear-gradient(135deg, #164d99 0%, #2563eb 50%, #1e3a8a 100%);
    border: 2px solid var(--gold);
    box-shadow: 0 0 24px rgba(255,215,0,.6), inset 0 0 24px rgba(255,215,0,.2);
    transform: rotateY(180deg);
  }
  .num-circle {
    flex-shrink: 0;
    width: 42px; height: 42px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-chunky); font-size: 1.4rem;
    color: var(--gold);
    background: rgba(0,0,0,.4);
    border: 2px solid var(--gold);
    box-shadow: 0 0 10px var(--gold);
    margin-right: 14px;
  }
  .face-front .hidden-marks {
    flex: 1;
    letter-spacing: .5em;
    color: rgba(0,229,255,.35);
    font-family: var(--font-chunky);
    font-size: 1.3rem;
  }
  .face-back .answer-text {
    flex: 1;
    font-family: var(--font-display);
    letter-spacing: .04em;
    font-size: clamp(1rem, 1.6vw, 1.35rem);
    color: var(--white);
    line-height: 1.1;
    text-shadow: 0 2px 6px rgba(0,0,0,.6);
  }
  .face-back .answer-pts {
    flex-shrink: 0;
    background: linear-gradient(135deg, var(--gold), var(--gold-2));
    color: #000;
    font-family: var(--font-chunky);
    font-size: 1.4rem;
    padding: 6px 16px;
    border-radius: 10px;
    box-shadow: 0 0 16px var(--gold);
    margin-left: 10px;
  }

  /* Strikes fila */
  .strikes {
    display: flex; gap: 18px;
    justify-content: center;
    margin: 6px 0 4px;
  }
  .strike-slot {
    width: 60px; height: 60px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-chunky); font-size: 2rem;
    color: rgba(255,255,255,.15);
    background: rgba(0,0,0,.35);
    border: 3px solid rgba(255,255,255,.15);
    transition: all .3s cubic-bezier(.34,1.56,.64,1);
  }
  .strike-slot.on {
    color: var(--red);
    border-color: var(--red);
    background: rgba(255,23,68,.15);
    box-shadow: 0 0 24px var(--red), inset 0 0 16px rgba(255,23,68,.4);
    animation: strikeShake .5s cubic-bezier(.36,.07,.19,.97);
  }
  @keyframes strikeShake {
    0%,100% { transform: translateX(0) rotate(0); }
    20%     { transform: translateX(-10px) rotate(-8deg); }
    40%     { transform: translateX(10px)  rotate(8deg); }
    60%     { transform: translateX(-6px)  rotate(-4deg); }
    80%     { transform: translateX(6px)   rotate(4deg); }
  }

  /* Controles */
  .controls {
    width: 100%; max-width: 1200px;
    display: flex; flex-wrap: wrap; gap: 10px;
    justify-content: center;
    align-items: center;
  }
  .btn {
    font-family: var(--font-chunky);
    font-size: 1rem;
    padding: 12px 22px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    letter-spacing: .04em;
    color: #fff;
    transition: transform .15s, box-shadow .2s, filter .2s;
    text-transform: uppercase;
    position: relative;
    overflow: hidden;
  }
  .btn:hover { transform: translateY(-3px) scale(1.05); filter: brightness(1.15); }
  .btn:active { transform: translateY(0) scale(.98); }
  .btn:disabled { opacity: .35; cursor: not-allowed; transform: none; }
  .btn-strike {
    background: linear-gradient(135deg, var(--red), #B71C1C);
    box-shadow: 0 4px 16px rgba(255,23,68,.5), 0 0 24px rgba(255,23,68,.3);
  }
  .btn-team {
    background: linear-gradient(135deg, var(--team-color, var(--cyan)), rgba(0,0,0,.4));
    box-shadow: 0 4px 16px var(--team-color, var(--cyan));
  }

/* ------- Utilidades ------- */
const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
const norm = s => s.toString().toLowerCase()
  .normalize("NFD").replace(/[̀-ͯ]/g,"")
  .replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();

function checkMatch(input, ans) {
  const ni = norm(input);
  if (!ni) return false;
  const targets = [norm(ans.text), ...(ans.aliases||[]).map(norm)];
  for (const t of targets) {
    if (!t) continue;
    if (ni === t) return true;
    if (t.includes(ni) && ni.length >= 3) return true;
    if (ni.includes(t) && t.length >= 3) return true;
  }
  // por palabras
  const iw = ni.split(" ");
  const tw = norm(ans.text).split(" ");
  const hit = iw.filter(w => tw.some(a => a.length>=3 && (a.includes(w) || w.includes(a)))).length;
  return hit >= Math.max(1, Math.ceil(tw.length * 0.5));
}

/* ------- Audio (Web Audio API) ------- */
let audioCtx = null;
let muted = false;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e) { audioCtx = null; }
  }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
}
function beep({freq=440, dur=.2, type="sine", vol=.25, sweep=null, delay=0}={}) {
  if (muted) return;
  ensureAudio(); if (!audioCtx) return;
  const t0 = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (sweep) osc.frequency.exponentialRampToValueAtTime(Math.max(30, sweep), t0 + dur);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  osc.connect(g).connect(audioCtx.destination);
  osc.start(t0); osc.stop(t0 + dur + .02);
}
function playApplause(dur=1.5) {
  if (muted) return;
  ensureAudio(); if (!audioCtx) return;
  const bufSize = audioCtx.sampleRate * dur;
  const buffer = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i=0;i<bufSize;i++) {
    const env = Math.min(1, i/(audioCtx.sampleRate*.15)) * Math.max(0, 1 - i/bufSize);
    data[i] = (Math.random()*2-1) * env * 0.35;
  }
  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  const filt = audioCtx.createBiquadFilter();
  filt.type = "bandpass"; filt.frequency.value = 2200; filt.Q.value = .8;
  const g = audioCtx.createGain(); g.gain.value = .5;
  src.connect(filt).connect(g).connect(audioCtx.destination);
  src.start();
}

function renderControls(r) {
  if (state.roundOver) {
    const isLast = state.roundIdx + 1 >= ROUNDS.length;
    return `

      </div>
    `;
  }

  const showSteal = state.strikes >= MAX_STRIKES && !state.stealMode && state.revealed.length < r.answers.length;

  return `

    <div class="controls">
      <button class="btn btn-team t1 ${state.activeTeam===0?'active':''}" data-team="0">${state.teams[0].emoji} ${escapeHTML(state.teams[0].name)}</button>

    </div>
  `;
}

function bindControls(r) {
  if (state.roundOver) {
    $("#nextBtn").onclick = nextRound;
    return;
  }
  const gi = $("#guessInput");
  gi.focus();
  gi.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); handleGuess(gi.value); gi.value=""; }
  });
  $("#guessBtn").onclick = () => { handleGuess(gi.value); gi.value=""; gi.focus(); };
  $("#strikeBtn").onclick = () => doStrike();
  $$(".btn-team").forEach(b => b.onclick = () => { state.activeTeam = +b.dataset.team; render(); });
  const stealBtn = $("#stealBtn"); if (stealBtn) stealBtn.onclick = () => enterStealMode();
  $("#skipBtn").onclick = () => finishRound();
}

/* ------- Lógica ------- */
function handleGuess(text) {
  if (!text || !text.trim() || state.roundOver) return;
  const r = ROUNDS[state.roundIdx];
  let matchIdx = -1;
  for (let i=0;i<r.answers.length;i++) {
    if (!state.revealed.includes(i) && checkMatch(text, r.answers[i])) { matchIdx=i; break; }
  }
  if (matchIdx>=0) revealAnswer(matchIdx);
  else doStrike();
}

function revealAnswer(i) {
  if (state.roundOver) return;
  if (state.revealed.includes(i)) return;
  const r = ROUNDS[state.roundIdx];
  const a = r.answers[i];
  state.revealed.push(i);

  // el pool crece con cada acierto; se consolida al final al ganador
  state.pool += a.points;
  state.winningTeam = state.activeTeam;

  sfx.correct();
  const mult = roundMultiplier();
  const shownPts = a.points * mult;
  flashFeedback(`¡${a.text}! +${shownPts} pts para el pool${mult>1?" (×2)":""}`, "correct");

  render();
  animateScore(state.activeTeam);
  confettiBurst(30, state.activeTeam===0 ? ["#00E5FF","#00B8D4","#FFD700","#FFFFFF"] : ["#FF006E","#C2185B","#FFD700","#FFFFFF"]);

  // ¿completó todas?
  if (state.revealed.length === r.answers.length) {
    setTimeout(() => {
      flashFeedback("¡TODAS LAS RESPUESTAS! 🎉", "perfect");
      sfx.win();
      confettiBurst(180);
      finishRound({ perfect: true });
    }, 700);
  }
  // si estaba en modo robo, con acertar 1 basta: se lleva todo
  else if (state.stealMode) {
    setTimeout(() => {
      flashFeedback(`¡ROBO EXITOSO por ${state.teams[state.activeTeam].name}!`, "perfect");
      sfx.win();
      confettiBurst(150);
      finishRound({ stolen: true });
    }, 600);
  }
}

function doStrike() {
  if (state.roundOver) return;
  if (state.stealMode) {
    // el robo falla: el equipo original conserva el pool
    sfx.buzz();
    showStrikeOverlay();
    screenShake();
    flashFeedback("¡Robo fallido! El pool se queda con el equipo original.", "wrong");
    state.activeTeam = 1 - state.activeTeam; // regresa al equipo original
    state.winningTeam = state.activeTeam;
    setTimeout(() => finishRound({ stealFailed: true }), 900);
    return;
  }

  state.strikes++;
  sfx.wrong();
  showStrikeOverlay();
  screenShake();
  flashFeedback(`¡STRIKE ${state.strikes}! ✕`, "wrong");
  render();

  if (state.strikes >= MAX_STRIKES) {
    flashFeedback(`3 strikes. ${state.teams[1-state.activeTeam].name} puede ROBAR con una sola respuesta.`, "wrong");
  }
}

function enterStealMode() {
  state.stealMode = true;
  state.activeTeam = 1 - state.activeTeam;
  toast(`🎯 ${state.teams[state.activeTeam].name} tiene 1 intento para robar`);
  sfx.tick();
  render();
}

function finishRound(opts = {}) {
  state.roundOver = true;
  state.revealAll = true;
  // Consolidar: aplicar multiplicador y sumar SOLO al equipo ganador
  const mult = roundMultiplier();
  const winner = state.winningTeam;
  const consolidated = state.pool * mult;
  if (winner >= 0 && consolidated > 0) {
    state.teams[winner].roundPts = consolidated;
    state.teams[winner].score += consolidated;
    animateScore(winner);
    showRoundWin(state.teams[winner].name, state.pool, mult>1);
    if (opts.perfect) confettiBurst(100);
    if (opts.perfect || opts.stolen) setTimeout(()=>confettiBurst(140), 400);
  }
  sfx.reveal();
  render();
}

function nextRound() {
  if (state.roundIdx + 1 >= ROUNDS.length) {
    state.screen = "end";
    render();
    setTimeout(() => confettiBurst(300), 200);
    setTimeout(() => sfx.epic(), 100);
    return;
  }
  state.roundIdx++;
  state.revealed = [];
  state.strikes = 0;
  state.roundOver = false;
  state.stealMode = false;
  state.revealAll = false;
  state.pool = 0;
  state.winningTeam = -1;
  state.teams.forEach(t => t.roundPts = 0);
  // el equipo que menos puntos tiene inicia con turno (fairness)
  state.activeTeam = state.teams[0].score <= state.teams[1].score ? 0 : 1;
  showRoundSplash(state.roundIdx, () => render());
}

function animateScore(idx) {
  const el = $(`#score-${idx}`);
  if (!el) return;
  el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump");
}

function flashFeedback(msg, type="correct") {
  const el = $("#feedback");
  if (!el) return;
  el.textContent = msg;
  el.className = "feedback " + type;
}

function renderEnd(root) {
  const [t1,t2] = state.teams;
  let winner = null;
  if (t1.score > t2.score) winner = t1;
  else if (t2.score > t1.score) winner = t2;
  root.innerHTML = `

          <div class="s">${t1.score}</div>

        <div class="final-card t2">

        </div>
      </div>
      <p class="title-tag">${winner ? "El equipo demostró conocer las <b>dimensiones</b>, los <b>métodos</b> y todos los rincones de la metodología científica." : "Ambos equipos empatan — sin duda, dominan la metodología a la par."}</p>
      <div class="controls">

  `;
  $("#againBtn").onclick = () => {

}

/* ---- Keybinds globales ---- */
document.addEventListener("keydown", e => {
  if (state.screen !== "round") {
    if (state.screen === "end" && e.key === "Enter") { $("#againBtn")?.click(); }
    return;
  }
  const inField = e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA";
  // números para revelar respuestas incluso mientras se escribe SOLO si Ctrl/Alt
  if (!inField) {
    if (e.key === " ") { e.preventDefault(); doStrike(); }
    else if (e.key === "Tab") { e.preventDefault(); state.activeTeam = 1 - state.activeTeam; render(); }
    else if (e.key.toLowerCase() === "r") {
      if (state.strikes >= MAX_STRIKES && !state.stealMode) { e.preventDefault(); enterStealMode(); }
    }
    else if (e.key.toLowerCase() === "n") {
      if (state.roundOver) { e.preventDefault(); nextRound(); }
    }
    else if (/^[1-9]$/.test(e.key)) {
      const i = parseInt(e.key,10) - 1;
      const r = ROUNDS[state.roundIdx];
      if (i < r.answers.length) { e.preventDefault(); revealAnswer(i); }
    }
  } else {
    if (e.key === "Enter") { /* input tiene su handler propio */ }
  }
});

/* ---- Utils ---- */
function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ---- Utility buttons ---- */
$("#soundBtn").onclick = () => {
  muted = !muted;
  $("#soundBtn").textContent = muted ? "🔇" : "🔊";
  if (!muted) sfx.tick();
};
$("#rulesBtn").onclick = () => openRules();

/* ---- Init ---- */
render();
</script>
